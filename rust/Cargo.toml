[package]
name = "auricle_core"
version = "0.3.0"
edition = "2021"
rust-version = "1.91"

[lib]
name = "auricle_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
jni22 = { package = "jni", version = "0.22" }
rustls-platform-verifier = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "cookies", "gzip", "form"] }
ytmapi-rs = { version = "0.3.1", features = ["reqwest"] }
strsim = "0.11"
iroh = "1.5"
base64 = "0.22"
flate2 = "1.0"
log = "0.4"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
opt-level = "s"
